[project]
name = "gladiavore"
version = "0.1.0"
description = "Gladiavore — career roguelike: arena matches, downtime hub, beast-pit combat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tcod>=16.0",
    "tcod-ecs>=5.0",
    "numpy>=1.26",
    "Pillow>=10.0",
    "platformdirs>=4.0",
]

[project.scripts]
gladiavore = "src.main:main"
# Legacy alias from KDVR clone lineage
kds-roguelike = "src.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
